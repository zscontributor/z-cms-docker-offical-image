# Z-CMS — self-contained Apache httpd reverse-proxy config.
# ${DOMAIN} expands from the container environment (set by compose/apache.yml).

ServerRoot "/usr/local/apache2"
Listen 80

# --- Modules ---------------------------------------------------------------
LoadModule mpm_event_module     modules/mod_mpm_event.so
LoadModule authz_core_module    modules/mod_authz_core.so
LoadModule unixd_module         modules/mod_unixd.so
LoadModule log_config_module    modules/mod_log_config.so
LoadModule headers_module       modules/mod_headers.so
LoadModule proxy_module         modules/mod_proxy.so
LoadModule proxy_http_module    modules/mod_proxy_http.so
LoadModule rewrite_module       modules/mod_rewrite.so
# Needed only for the HTTPS vhost at the bottom:
# LoadModule ssl_module         modules/mod_ssl.so
# LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

User daemon
Group daemon
ServerName ${DOMAIN}
ServerAdmin admin@${DOMAIN}

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# Large uploads (media, package sideloads).
LimitRequestBody 67108864

# --- HTTP virtual host -----------------------------------------------------
<VirtualHost *:80>
    ServerName ${DOMAIN}

    ProxyPreserveHost On
    ProxyRequests Off
    # Tell the backends the original scheme. Change to "https" when TLS is
    # terminated in front of Apache (upstream LB / the SSL vhost below).
    RequestHeader set X-Forwarded-Proto "http"

    # Order matters: most specific first, the site catch-all last.
    # /api/v1 ONLY: cms-api mounts every route under that prefix, while
    # site-runtime serves the other /api/* paths — /api/contact/submit and
    # /api/forms/<id>/submit are where a public form posts. Widen this and
    # every contact and appointment form on the site 404s.
    ProxyPass        "/api/v1/"     "http://cms-api:4100/api/v1/"
    ProxyPassReverse "/api/v1/"     "http://cms-api:4100/api/v1/"

    ProxyPass        "/admin"       "http://admin-web:3001/admin"
    ProxyPassReverse "/admin"       "http://admin-web:3001/admin"

    # Public media, path preserved (path-style S3: /zcms-media/<key>).
    ProxyPass        "/zcms-media/" "http://rustfs:9000/zcms-media/"
    ProxyPassReverse "/zcms-media/" "http://rustfs:9000/zcms-media/"

    ProxyPass        "/"            "http://site-runtime:3000/"
    ProxyPassReverse "/"            "http://site-runtime:3000/"
</VirtualHost>

# --- HTTPS virtual host (optional) -----------------------------------------
