name: z-cms

# =============================================================================
# Z-CMS — the full stack, pulling the official images from Docker Hub.
#
# Run alone for a local quickstart (app ports published on 127.0.0.1):
#     docker compose up -d
#     open http://localhost:3000            # public site
#     open http://localhost:3001/admin      # admin (SEED_ADMIN_EMAIL / _PASSWORD)
#
# To put it behind a reverse proxy with TLS, layer a proxy overlay on top —
# the app ports stay on localhost and the proxy routes to the services by name:
#     docker compose -f docker-compose.yml -f compose/traefik.yml up -d
#     docker compose -f docker-compose.yml -f compose/caddy.yml   up -d
#     docker compose -f docker-compose.yml -f compose/nginx.yml   up -d
#     docker compose -f docker-compose.yml -f compose/apache.yml  up -d
#
# All configuration comes from ./.env  (start from .env.example). Requires
# Docker Engine 24+ and the Compose v2 plugin.
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — the system of record. RLS-enforced multi-tenancy relies on the
  # two-role split created by the init script (see the SQL for why).
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: zcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zcms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the NOBYPASSRLS runtime role on first boot. Load-bearing.
      - ./compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zcms} -d ${POSTGRES_DB:-zcms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Redis — cache, locks, rate limiting, BullMQ. Password-protected.
  # --------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: zcms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # RustFS — S3-compatible object storage for media (Apache-2.0). Swap for a
  # managed provider (S3, R2) by removing this + storage-init and pointing
  # S3_ENDPOINT / S3_PUBLIC_URL at the provider. Media reads are public GET;
  # uploads are proxied through cms-api (no browser-direct/presigned PUT).
  # --------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: zcms-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs-data:/data
    ports:
      # Quickstart access. Behind a proxy these are unused (proxy routes
      # ${DOMAIN}/zcms-media -> rustfs:9000 internally).
      - "127.0.0.1:9000:9000"   # S3 API / public media
      - "127.0.0.1:9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Creates the media bucket once and makes it public-read, then exits. Plain
  # S3, so it works unchanged against any provider.
  storage-init:
    image: amazon/aws-cli:latest
    container_name: zcms-storage-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-zcms-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        endpoint="--endpoint-url http://rustfs:9000"
        until aws $$endpoint s3 ls >/dev/null 2>&1; do sleep 2; done
        aws $$endpoint s3api create-bucket --bucket "$$BUCKET" || true
        aws $$endpoint s3api put-bucket-policy --bucket "$$BUCKET" --policy "{
          \"Version\": \"2012-10-17\",
          \"Statement\": [{
            \"Sid\": \"PublicRead\", \"Effect\": \"Allow\",
            \"Principal\": { \"AWS\": [\"*\"] },
            \"Action\": [\"s3:GetObject\"],
            \"Resource\": [\"arn:aws:s3:::$$BUCKET/*\"]
          }]
        }"
        echo "storage ready: $$BUCKET is public-read"

  # Captures all outgoing mail so invites/password-resets work with no real mail
  # server. UI at http://localhost:8025. Point SMTP_* at a real server, or use
  # the admin's Settings -> Mail, for production delivery.
  mailpit:
    image: axllent/mailpit:latest
    container_name: zcms-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI

  # --------------------------------------------------------------------------
  # migrate — one-shot: apply pending DB migrations and register the signed
  # built-in themes/plugins shipped in this image. Every app service waits for
  # it to finish. Idempotent; runs again on every `up`.
  # --------------------------------------------------------------------------
  migrate:
    image: zcms/migrate:${ZCMS_VERSION:-latest}
    container_name: zcms-migrate
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zcms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zcms}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # cms-api — the NestJS core API. The only service on BOTH networks: it needs
  # the internet (marketplace, plugin egress on a plugin's behalf) AND it is the
  # single door the sandboxed plugin-runtime is allowed to reach.
  # --------------------------------------------------------------------------
  cms-api:
    image: zcms/cms-api:${ZCMS_VERSION:-latest}
    container_name: zcms-cms-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      CMS_API_PORT: "4100"
      DATABASE_URL: postgresql://${POSTGRES_USER:-zcms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zcms}?schema=public
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-zcms_app}:${APP_DB_PASSWORD:-zcms_app}@postgres:5432/${POSTGRES_DB:-zcms}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://rustfs:9000
      PLUGIN_RUNTIME_URL: http://plugin-runtime:4200
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-http://localhost:3001}
      SITE_RUNTIME_URL: ${SITE_RUNTIME_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${CMS_API_PORT:-4100}:4100"
    networks:
      - default
      - zcms-sandbox

  # --------------------------------------------------------------------------
  # worker — BullMQ background jobs (mail, media processing, scans). No inbound
  # port; dials Redis. First-party infra, so it holds DB + S3 credentials.
  # --------------------------------------------------------------------------
  worker:
    image: zcms/worker:${ZCMS_VERSION:-latest}
    container_name: zcms-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zcms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zcms}?schema=public
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-zcms_app}:${APP_DB_PASSWORD:-zcms_app}@postgres:5432/${POSTGRES_DB:-zcms}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://rustfs:9000
      # The worker calls back into cms-api for mail delivery, the marketplace
      # revocation sync, deferred plugin hooks and theme builds. The CMS_API_URL
      # in .env is a localhost value (wrong inside this container), so point it at
      # the service over the compose network here.
      CMS_API_URL: http://cms-api:4100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # admin-web — the Next.js admin UI. Holds no credentials; talks to the API
  # server-side over the compose network. Served under ADMIN_BASE_PATH (/admin).
  # --------------------------------------------------------------------------
  admin-web:
    image: zcms/admin-web:${ZCMS_VERSION:-latest}
    container_name: zcms-admin-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      CMS_API_URL: http://cms-api:4100
      SITE_RUNTIME_URL: ${SITE_RUNTIME_URL:-http://localhost:3000}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/admin}
      # The origin media is served from, for the admin's own img-src CSP.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL in .env}
    depends_on:
      cms-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-3001}:3001"

  # --------------------------------------------------------------------------
  # site-runtime — the Next.js public site. Runs THIRD-PARTY theme code
  # in-process, so it is hardened like plugin-runtime and is NEVER handed the
  # full .env: only the handful of values below, none of them a real credential.
  # --------------------------------------------------------------------------
  site-runtime:
    image: zcms/site-runtime:${ZCMS_VERSION:-latest}
    container_name: zcms-site-runtime
    restart: unless-stopped
    user: "node"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m
      - /app/apps/site-runtime/.next/cache:size=128m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=640
      PORT: "3000"
      CMS_API_URL: http://cms-api:4100
      THEME_CACHE_DIR: /tmp/zcms-themes
      CMS_API_PUBLIC_URL: ${CMS_API_PUBLIC_URL:-}
      FIRST_PARTY_PUBLIC_KEY: ${FIRST_PARTY_PUBLIC_KEY:?set FIRST_PARTY_PUBLIC_KEY in .env}
      CMS_INTERNAL_TOKEN: ${SITE_RUNTIME_INTERNAL_TOKEN:?set a distinct SITE_RUNTIME_INTERNAL_TOKEN}
      MARKETPLACE_PUBLIC_KEY: ${MARKETPLACE_PUBLIC_KEY:-}
      OPERATOR_PUBLIC_KEY: ${OPERATOR_PUBLIC_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL in .env}
    depends_on:
      cms-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SITE_RUNTIME_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 128

  # --------------------------------------------------------------------------
  # plugin-runtime — the ONLY service that runs untrusted marketplace code. Its
  # own minimal, credential-free image. Lives alone with cms-api on an internal
  # network that has NO route off the host: the V8 isolate is the first
  # boundary, this network is the last.
  # --------------------------------------------------------------------------
  plugin-runtime:
    image: zcms/plugin-runtime:${ZCMS_VERSION:-latest}
    container_name: zcms-plugin-runtime
    restart: unless-stopped
    user: "node"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PLUGIN_RUNTIME_PORT: "4200"
      PLUGIN_DIR: /plugins
      FIRST_PARTY_PUBLIC_KEY: ${FIRST_PARTY_PUBLIC_KEY:?set FIRST_PARTY_PUBLIC_KEY in .env}
      OPERATOR_PUBLIC_KEY: ${OPERATOR_PUBLIC_KEY:-}
      CMS_API_URL: http://cms-api:4100
      CMS_INTERNAL_TOKEN: ${CMS_INTERNAL_TOKEN:?set CMS_INTERNAL_TOKEN in .env}
    # Signed built-in plugins ship inside the image at /plugins; no host mount.
    networks:
      - zcms-sandbox
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128

networks:
  # The ordinary bridge with a default route.
  default:
    driver: bridge
  # No gateway, no route, no internet. plugin-runtime lives here alone with
  # cms-api — the network-level egress lock for escaped plugin code.
  zcms-sandbox:
    internal: true

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
